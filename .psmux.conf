set -g mouse on
set -g renumber-windows on
set -g set-titles on
set -g display-time 2500
set -g history-limit 10000
set -g extended-keys on
set -sg escape-time 0
set -wg aggressive-resize on
set -wg allow-rename on
set -wg mode-keys vi

unbind C-b
set -g prefix C-a
bind C-a send-prefix
set-environment -gh PREFIXCHAR A

bind C-h split-window -h -c "#{pane_current_path}"
bind C-v split-window -v -c "#{pane_current_path}"
bind C-s command-prompt -p "new window shell:" "new-window %%"
bind C-c new-window wsl.exe

bind C-k clear-history \; display-message "History cleared"
bind C-l refresh-client
bind C-n command-prompt -p "rename:" "rename-window %%"
bind S-N rename-window "#{b:pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind - select-window -l

# Make panes equal size
bind = select-layout -E

# Toggle zoomed pane & focus
bind C-w if -F '#{window_zoomed_flag}' last-pane 'last-pane; resize-pane -Z'

unbind C-z
# bind C-z command-prompt -p "Really suspend tmux (y/N)?" "if -F '#{==:%%,y}' suspend-client"

bind -n M-S-H resize-pane -L 5
bind -n M-S-J resize-pane -D 5
bind -n M-S-K resize-pane -U 5
bind -n M-S-L resize-pane -R 5

# bind -n C-S-Left swap-window -d -t -1
# bind -n C-S-Right swap-window -d -t +1

bind S-H swap-pane -L
bind S-J swap-pane -D
bind S-K swap-pane -U
bind S-L swap-pane -R

bind m command-prompt -p "move window to:" "swap-window -t '%%'"

bind r source ~/.psmux.conf \; display-message "Reloaded .psmux.conf"

set -g message-style bg=color226,fg=color17

%if '#{PSMUX_ALT_STATUS}'
  # White BG
  set -g status-style bg=color251,fg=color18
  set -g window-status-current-style bg=color27,fg=color194
  %hidden PREFIXFG=color252
  %hidden PREFIXBG=color22
  %hidden USERFG=color22
  %hidden HOSTFG=color22
  %hidden SESSIONFG=color25
%else
  # Dark green BG
  set -g status-style bg=#183028,fg=white
  set -g window-status-current-style bg=color28,fg=color194
  %hidden PREFIXFG=black
  %hidden PREFIXBG=color40
  %hidden USERFG=color76
  %hidden HOSTFG=color76
  %hidden SESSIONFG=color159
%endif

set -g status-left '#{?client_prefix,#[fg=#{PREFIXFG}#,bg=#{PREFIXBG}][^#{PREFIXCHAR}],#{?pane_in_mode,#[fg=colour233#,bg=colour208][CC],[^#{PREFIXCHAR}]}}#[default] '
set -g status-right ' #[fg=#{USERFG}]#{user}#[default]@#[fg=#{HOSTFG}]#h #[default][#[fg=#{SESSIONFG}]#{?session_many_attached,#{session_attached}#[default]:#[fg=#{SESSIONFG}],}#S#[default]]'

